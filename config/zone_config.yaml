# ============================================================
# ZoneTrend — Zone Detection Configuration
# ============================================================
# All thresholds are expressed as ATR multiples.
# Using ATR-relative thresholds (not fixed INR values) ensures
# the detector behaves consistently across different volatility
# regimes and across different instruments.
#
# Pattern reference:
#   RBD  →  Rally → Base → Drop   →  Supply Zone (resistance)
#   DBR  →  Drop  → Base → Rally  →  Demand Zone (support)
#
# The "base" is the tight consolidation between the two legs.
# Zone boundaries are drawn from the base candles, not the legs.
# ============================================================

zones:

  # ----------------------------------------------------------
  # Base candle detection
  # ----------------------------------------------------------
  # A candle is classified as a "base candle" only if both
  # conditions below are met simultaneously.

  base_range_multiplier: 3
  # Max allowed candle range (High - Low) as a multiple of ATR.
  # Lower value = stricter base (tighter, quieter candles only).
  # Higher value = more permissive (allows noisier bases).
  # Typical range: 0.5 – 1.5
  # Rationale: a base represents indecision / equilibrium.
  # Candles with range > 1x ATR are too large to be called
  # indecisive; they are already showing directional intent.

  base_body_multiplier: 0.7
  # Max allowed candle body (|Close - Open|) as a multiple of ATR.
  # Body must be tighter than range, ensuring genuine indecision.
  # Typical range: 0.2 – 0.7
  # Rationale: a base with a large body candle (e.g. a strong
  # bullish candle inside a "base") is not really a base —
  # it is a directional move with small wicks.

  min_base_length: 1
  # Minimum number of consecutive base candles required.
  # A single-candle base (1 candle) is valid and common — it
  # represents a very sharp imbalance point where institutions
  # placed orders with minimal price negotiation.
  # Typical value: 1

  max_base_length: 8
  # Maximum number of consecutive base candles.
  # Beyond 5 candles the consolidation becomes a ranging market
  # rather than a supply/demand imbalance point, and the
  # statistical edge degrades significantly.
  # Typical range: 3 – 6

  # ----------------------------------------------------------
  # Departure leg (the strong move that exits the base)
  # ----------------------------------------------------------
  # This is the MOST IMPORTANT parameter.
  # The departure leg is the evidence of the imbalance.
  # A weak departure means institutions were not truly committed.

  departure_strength: 0.7
  # Minimum departure candle body as a multiple of ATR.
  # The departure candle must close strong in its direction:
  #   DBR departure → large bullish body (Close >> Open)
  #   RBD departure → large bearish body (Open >> Close)
  # The departure body must exceed: departure_strength × ATR.
  # Typical range: 1.0 – 2.0
  # Note: 1.2 means the departure body alone must be 1.2x ATR.
  # This filters out weak, ambiguous departures.

  departure_close_ratio: 0.3
  # Minimum ratio of where Close sits within the departure candle range.
  # For a bullish departure: (Close - Low) / (High - Low) >= this value.
  # For a bearish departure: (High - Close) / (High - Low) >= this value.
  # Ensures the candle CLOSED strong, not just had a wide range with a weak close.
  # Typical range: 0.5 – 0.8

  # ----------------------------------------------------------
  # Arrival leg (the directional move into the base)
  # ----------------------------------------------------------
  # The arrival leg confirms that price was moving directionally
  # before it entered the base. Without a clear arrival, the
  # base could be a random consolidation rather than a true
  # supply/demand imbalance.

  arrival_lookback: 2
  # How many candles before the base to examine for the arrival leg.
  # Net price move over this window must be in the correct direction.
  # Typical range: 3 – 10
  # Rationale: 5 candles covers approximately one trading week —
  # long enough to see a meaningful directional move, short enough
  # to avoid picking up ancient trend changes.

  arrival_min_move: 0.5
  # Minimum net price move of the arrival leg, expressed as a
  # multiple of ATR. This is measured as:
  #   |close[base_start - 1] - close[base_start - arrival_lookback]| / ATR
  # Typical range: 1.0 – 3.0
  # Rationale: a move smaller than 1.5x ATR is barely directional —
  # it could be noise. We want to see the market was clearly moving
  # before it paused at the base.

  # ----------------------------------------------------------
  # Zone status and invalidation
  # ----------------------------------------------------------

  max_test_count: 5
  # How many times price can re-enter a zone before the zone is
  # considered "consumed" and removed from active tracking.
  # Each test uses up some of the unfilled orders sitting in the zone.
  # A zone tested 3+ times has likely had most of its orders filled.
  # After max_test_count tests, status → 'consumed'.
  # Typical range: 2 – 4

  invalidation_mode: "close"
  # How to trigger zone invalidation.
  # Options:
  #   "close"  → zone is invalid when a candle CLOSES beyond the zone boundary.
  #              More conservative, fewer false invalidations.
  #   "wick"   → zone is invalid when High/Low TOUCHES beyond the boundary.
  #              More aggressive, faster invalidation.
  # Recommendation: "close" for swing trading (daily timeframe).

  # ----------------------------------------------------------
  # Zone scoring weights
  # ----------------------------------------------------------
  # Each detected zone receives a strength score from 0.0 to 1.0.
  # The score is a weighted combination of four components.
  # Weights must sum to 1.0.
  #
  # Use this score to rank zones, filter low-quality zones,
  # and as a feature in downstream ML models.

  scoring:
    departure_weight:      0.40
    # Weight for departure leg strength.
    # Highest weight because a strong, clean departure is the
    # primary evidence of an institutional imbalance.

    base_tightness_weight: 0.25
    # Weight for base tightness (how tight the consolidation was).
    # A very tight base (small range, small bodies) indicates a
    # sharper imbalance with less price negotiation.

    arrival_weight:        0.20
    # Weight for arrival leg momentum.
    # A stronger arrival means the market was more decisively
    # moving before it found this zone.

    volume_weight:         0.15
    # Weight for departure volume ratio (volume on the departure
    # candle relative to its 20-day MA).
    # High volume on the departure confirms institutional activity.
    # Lower weight because volume data can be noisy.

  # ----------------------------------------------------------
  # Output and filtering
  # ----------------------------------------------------------

  min_strength_threshold: 0.15
  # Zones with a strength score below this value are dropped.
  # This removes very weak detections that are likely noise.
  # Set to 0.0 to keep all detected zones for research/analysis.

  save_format: "csv"
  # Format for saving zone data.  Only "csv" is currently supported.
